<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>태풍이의 기상 인증 시스템</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');
    body { font-family: 'Gowun Dodum', sans-serif; }
  </style>
</head>
<body class="bg-amber-50/50 min-h-screen pb-12">
  <div id="root"></div>

  <!-- Firebase App & Firestore Modular Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAIe2DwSxkwS-iFUvEaE6uYogOdkB-qMSU",
      authDomain: "typhoon-wakeup.firebaseapp.com",
      projectId: "typhoon-wakeup",
      storageBucket: "typhoon-wakeup.firebasestorage.app",
      messagingSenderId: "550727370675",
      appId: "1:550727370675:web:b31de70ff5ec013b4a2dc6",
      measurementId: "G-8YLN6BLZKG"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 전역 변수로 React 스크립트에 공유
    window.db = db;
    window.dbFuncs = { collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc };
  </script>

  <!-- React App Code -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [members, setMembers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [nameInput, setNameInput] = useState('');
      const [avatarType, setAvatarType] = useState('default');
      const [customImage, setCustomImage] = useState(null);
      const [targetHour, setTargetHour] = useState('09');
      const [targetMinute, setTargetMinute] = useState('00');
      const [checkWeekend, setCheckWeekend] = useState(false);
      const [selectedMemberForCalendar, setSelectedMemberForCalendar] = useState(null);
      
      // 관리자 설정 모달 상태
      const [adminModalMember, setAdminModalMember] = useState(null);
      const [adminPassword, setAdminPassword] = useState('');
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);

      const getAdjustedToday = () => {
        const now = new Date();
        const adjusted = new Date(now);
        adjusted.setHours(adjusted.getHours() - 4);
        adjusted.setMinutes(adjusted.getMinutes() - 30);
        
        const yyyy = adjusted.getFullYear();
        const mm = String(adjusted.getMonth() + 1).padStart(2, '0');
        const dd = String(adjusted.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      };

      const todayStr = getAdjustedToday();

      useEffect(() => {
        const checkDbTimer = setInterval(() => {
          if (window.db && window.dbFuncs) {
            clearInterval(checkDbTimer);
            const { collection, onSnapshot } = window.dbFuncs;
            const membersRef = collection(window.db, "members");

            const unsubscribe = onSnapshot(membersRef, (snapshot) => {
              const dataList = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));
              
              dataList.sort((a, b) => Number(a.id) - Number(b.id));
              
              setMembers(dataList);
              setLoading(false);
            }, (err) => {
              console.error("Firestore 로딩 에러:", err);
              setLoading(false);
            });

            return () => unsubscribe();
          }
        }, 100);

        return () => clearInterval(checkDbTimer);
      }, []);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 150;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > MAX_SIZE) {
                height *= MAX_SIZE / width;
                width = MAX_SIZE;
              }
            } else {
              if (height > MAX_SIZE) {
                width *= MAX_SIZE / height;
                height = MAX_SIZE;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            setCustomImage(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleAddMember = async (e) => {
        e.preventDefault();
        if (!nameInput.trim() || !window.db) return;

        const { doc, setDoc } = window.dbFuncs;
        const newId = Date.now().toString();

        const newMember = {
          name: nameInput.trim(),
          avatar: avatarType === 'upload' && customImage ? customImage : '👤',
          isCustomImage: avatarType === 'upload' && !!customImage,
          targetHour,
          targetMinute,
          checkWeekend,
          records: {}
        };

        try {
          await setDoc(doc(window.db, "members", newId), newMember);
          setNameInput('');
          setCustomImage(null);
          setAvatarType('default');
        } catch (err) {
          alert("작가 등록에 실패했습니다. Firebase 규칙을 확인해주세요!");
        }
      };

      // 프로필 삭제 함수
      const handleDeleteMember = async (id) => {
        if (!window.db) return;
        if (!confirm("정말 이 작가 프로필을 삭제하시겠습니까?")) return;

        const { doc, deleteDoc } = window.dbFuncs;
        try {
          await deleteDoc(doc(window.db, "members", id));
          setAdminModalMember(null);
          setIsAdminAuthenticated(false);
          setAdminPassword('');
        } catch (err) {
          alert("삭제에 실패했습니다.");
        }
      };

      const handleCheckIn = async (id, currentRecords) => {
        if (!window.db) return;
        const { doc, updateDoc } = window.dbFuncs;

        const member = members.find(m => m.id === id);
        if (!member) return;

        const now = new Date();
        const currentHour = now.getHours();
        const currentMinute = now.getMinutes();

        const targetH = parseInt(member.targetHour, 10);
        const targetM = parseInt(member.targetMinute, 10);
        
        const targetTotal = targetH * 60 + targetM + 10;
        const currentTotal = currentHour * 60 + currentMinute;

        const isSuccess = currentTotal <= targetTotal;
        const statusResult = isSuccess ? 'success' : 'fail';
        const timeStr = `${String(currentHour).padStart(2, '0')}:${String(currentMinute).padStart(2, '0')}`;

        const updatedRecords = {
          ...currentRecords,
          [todayStr]: { status: statusResult, time: timeStr }
        };

        try {
          await updateDoc(doc(window.db, "members", id), {
            records: updatedRecords
          });
        } catch (err) {
          alert("인증 저장에 실패했습니다.");
        }
      };

      const get7DaysList = () => {
        const days = [];
        const startDate = new Date(2026, 10, 11);
        const today = new Date(todayStr);
        
        let start = new Date(startDate);
        const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
        
        if (diffDays >= 7) {
          start.setDate(today.getDate() - 6);
        }

        for (let i = 0; i < 7; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const dateStr = `${yyyy}-${mm}-${dd}`;
          const dayNum = d.getDay();
          
          days.push({
            dateStr,
            monthDay: `${d.getMonth() + 1}/${d.getDate()}`,
            dayName: ['일', '월', '화', '수', '목', '금', '토'][dayNum],
            isSaturday: dayNum === 6,
            isSunday: dayNum === 0
          });
        }
        return days;
      };

      const getCalendarDays = () => {
        const list = [];
        const start = new Date(2026, 10, 11);
        const end = new Date(2026, 11, 11);

        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const dateStr = `${yyyy}-${mm}-${dd}`;
          const dayNum = d.getDay();

          list.push({
            dateStr,
            dayNum: d.getDate(),
            month: d.getMonth() + 1,
            isSaturday: dayNum === 6,
            isSunday: dayNum === 0
          });
        }
        return list;
      };

      const daysList = get7DaysList();

      if (loading) {
        return (
          <div class="min-h-screen flex items-center justify-center font-bold text-amber-900">
            ⚡ 태풍이의 인증 시스템 연결 중...
          </div>
        );
      }

      return (
        <div class="max-w-4xl mx-auto p-4 space-y-6">
          {/* Header */}
          <div class="bg-amber-400 p-6 rounded-3xl shadow-lg text-center border-4 border-amber-500">
            <h1 class="text-3xl font-black text-amber-950 flex items-center justify-center gap-2">
              <span>⚡</span> 태풍이의 기상 인증 시스템 <span>⏰</span>
            </h1>
          </div>

          {/* 작가 카드 목록 */}
          <div class="grid md:grid-cols-2 gap-4">
            {members.length === 0 ? (
              <div class="col-span-2 bg-white p-8 rounded-2xl text-center font-bold text-gray-500 border-2 border-dashed border-gray-300">
                아직 등록된 작가가 없습니다! 아래에서 첫 번째 작가를 등록해보세요 ⚡
              </div>
            ) : (
              members.map(member => {
                const records = member.records || {};
                const todayRecord = records[todayStr];
                const isCheckedToday = !!todayRecord;

                return (
                  <div key={member.id} class="bg-white p-5 rounded-2xl shadow-md border-2 border-amber-200 relative flex flex-col justify-between">
                    <div>
                      {/* 카드 상단 헤더 (프로필, 이름, 기록달력, 설정 버튼) */}
                      <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                          {member.isCustomImage ? (
                            <img src={member.avatar} alt={member.name} class="w-12 h-12 rounded-full object-cover border-2 border-amber-400" />
                          ) : (
                            <div class="w-12 h-12 rounded-full bg-slate-200 flex items-center justify-center text-2xl border-2 border-slate-300">
                              👤
                            </div>
                          )}
                          <div>
                            <h3 class="text-xl font-black text-gray-800">{member.name}</h3>
                            <p class="text-xs font-bold text-amber-600">목표: 오전 {member.targetHour}:{member.targetMinute}</p>
                          </div>
                        </div>

                        <div class="flex items-center gap-1.5">
                          <button
                            onClick={() => setSelectedMemberForCalendar(member)}
                            class="px-2.5 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs rounded-lg border border-amber-300"
                          >
                            📅 달력
                          </button>
                          <button
                            onClick={() => {
                              setAdminModalMember(member);
                              setIsAdminAuthenticated(false);
                              setAdminPassword('');
                            }}
                            class="p-1.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg border border-gray-300 text-xs font-bold"
                            title="설정"
                          >
                            ⚙️
                          </button>
                        </div>
                      </div>

                      <div class="mb-4">
                        {isCheckedToday ? (
                          <div class={`p-3 rounded-xl text-center font-bold text-sm ${todayRecord.status === 'success' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-rose-100 text-rose-800 border border-rose-300'}`}>
                            {todayRecord.status === 'success' ? '🎉 성공!' : '😅 지각!'} ({todayRecord.time} 인증)
                          </div>
                        ) : (
                          <button
                            onClick={() => handleCheckIn(member.id, records)}
                            class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-base rounded-xl shadow border-b-4 border-emerald-700 active:translate-y-0.5 transition"
                          >
                            ⏰ 기상 인증 버튼 누르기
                          </button>
                        )}
                      </div>
                    </div>

                    {/* 7일 트래커 바 */}
                    <div class="mt-2 pt-3 border-t border-gray-100">
                      <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-bold text-gray-500">최근 7일 현황</span>
                      </div>
                      <div class="grid grid-cols-7 gap-1 text-center">
                        {daysList.map(day => {
                          const rec = records[day.dateStr];
                          const isPastOrToday = day.dateStr <= todayStr;
                          
                          let bgColor = 'bg-gray-100';

                          if (rec) {
                            bgColor = rec.status === 'success' ? 'bg-emerald-500' : 'bg-rose-500';
                          } else if (isPastOrToday) {
                            if (!member.checkWeekend && (day.isSaturday || day.isSunday)) {
                              bgColor = 'bg-emerald-500';
                            } else if (day.dateStr < todayStr) {
                              bgColor = 'bg-rose-400';
                            }
                          }

                          return (
                            <div key={day.dateStr} class="flex flex-col items-center">
                              <div class={`w-full h-8 rounded-md ${bgColor} mb-1 transition-all`}></div>
                              <span class="text-[10px] font-bold text-gray-600">{day.monthDay}</span>
                              <span class={`text-[10px] font-bold ${day.isSaturday ? 'text-blue-600' : day.isSunday ? 'text-red-500' : 'text-gray-500'}`}>
                                {day.dayName}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>

          {/* 새 작가 등록 폼 */}
          <div class="bg-white p-6 rounded-2xl shadow-md border-2 border-amber-200 mt-8">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
              <span>✍️</span> 새 작가 등록하기
            </h2>
            <form onSubmit={handleAddMember} class="space-y-4">
              <div>
                <input
                  type="text"
                  placeholder="작가 이름 입력"
                  value={nameInput}
                  onChange={(e) => setNameInput(e.target.value)}
                  class="w-full p-3 border-2 border-amber-200 rounded-xl focus:outline-none focus:border-amber-400 font-bold"
                  required
                />
              </div>

              <div class="flex items-center gap-4">
                <span class="text-sm font-bold text-gray-600">프로필 선택:</span>
                <button
                  type="button"
                  onClick={() => setAvatarType('default')}
                  class={`px-3 py-1.5 rounded-lg text-sm font-bold border-2 ${avatarType === 'default' ? 'bg-amber-400 border-amber-500 text-amber-950' : 'bg-gray-100 border-gray-300'}`}
                >
                  기본 프로필
                </button>
                <label class={`px-3 py-1.5 rounded-lg text-sm font-bold border-2 cursor-pointer ${avatarType === 'upload' ? 'bg-amber-400 border-amber-500 text-amber-950' : 'bg-gray-100 border-gray-300'}`}>
                  내 사진 업로드
                  <input type="file" accept="image/*" onChange={(e) => { setAvatarType('upload'); handleImageUpload(e); }} class="hidden" />
                </label>
              </div>

              <div class="flex flex-wrap items-center gap-4 bg-amber-50 p-4 rounded-xl border border-amber-200">
                <span class="font-bold text-gray-700">목표 기상 시간 (오전):</span>
                <select value={targetHour} onChange={(e) => setTargetHour(e.target.value)} class="p-2 border-2 border-amber-300 rounded-lg font-bold">
                  {Array.from({ length: 12 }, (_, i) => String(i).padStart(2, '0')).map(h => (
                    <option key={h} value={h}>{h}시</option>
                  ))}
                </select>
                <select value={targetMinute} onChange={(e) => setTargetMinute(e.target.value)} class="p-2 border-2 border-amber-300 rounded-lg font-bold">
                  {['00', '10', '20', '30', '40', '50'].map(m => (
                    <option key={m} value={m}>{m}분</option>
                  ))}
                </select>
                <label class="flex items-center gap-2 cursor-pointer font-bold text-sm text-gray-600 ml-auto">
                  <input
                    type="checkbox"
                    checked={checkWeekend}
                    onChange={(e) => setCheckWeekend(e.target.checked)}
                    class="w-4 h-4 accent-amber-500 rounded"
                  />
                  주말에도 기상 인증하기
                </label>
              </div>

              <button type="submit" class="w-full py-3 bg-amber-400 hover:bg-amber-500 text-amber-950 font-black text-lg rounded-xl shadow border-b-4 border-amber-600 transition">
                참여 작가 등록하기
              </button>
            </form>
          </div>

          {/* 달력 모달 */}
          {selectedMemberForCalendar && (
            <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border-4 border-amber-400 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                  <h3 class="text-lg font-black text-gray-800">
                    📅 {selectedMemberForCalendar.name} 작가의 챌린지 달력
                  </h3>
                  <button onClick={() => setSelectedMemberForCalendar(null)} class="text-gray-400 font-bold hover:text-gray-600">✕</button>
                </div>
                <p class="text-xs font-bold text-amber-700 mb-4 bg-amber-50 p-2 rounded-lg">
                  * 11월 11일 ~ 12월 11일 한 달간의 기록입니다.
                </p>

                <div class="grid grid-cols-7 gap-2 text-center">
                  {getCalendarDays().map(day => {
                    const rec = (selectedMemberForCalendar.records || {})[day.dateStr];
                    const isPastOrToday = day.dateStr <= todayStr;
                    
                    let statusBg = 'bg-gray-100 text-gray-400';

                    if (rec) {
                      statusBg = rec.status === 'success' ? 'bg-emerald-500 text-white font-bold' : 'bg-rose-500 text-white font-bold';
                    } else if (isPastOrToday) {
                      if (!selectedMemberForCalendar.checkWeekend && (day.isSaturday || day.isSunday)) {
                        statusBg = 'bg-emerald-500 text-white font-bold';
                      } else if (day.dateStr < todayStr) {
                        statusBg = 'bg-rose-300 text-white font-bold';
                      }
                    }

                    return (
                      <div key={day.dateStr} class={`p-2 rounded-xl flex flex-col items-center justify-center ${statusBg}`}>
                        <span class="text-xs font-bold">{day.month}/{day.dayNum}</span>
                        <span class="text-[10px]">{rec ? rec.time : (statusBg.includes('emerald') ? '성공' : statusBg.includes('rose') ? '지각' : '-')}</span>
                      </div>
                    );
                  })}
                </div>
                
                <button
                  onClick={() => setSelectedMemberForCalendar(null)}
                  class="w-full mt-5 py-2.5 bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold rounded-xl shadow"
                >
                  닫기
                </button>
              </div>
            </div>
          )}

          {/* 관리자 설정 모달 (프로필 삭제용 비밀번호 입력) */}
          {adminModalMember && (
            <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border-4 border-amber-400">
                <div class="flex justify-between items-center mb-4">
                  <h3 class="text-lg font-black text-gray-800">
                    ⚙️ [{adminModalMember.name}] 작가 설정
                  </h3>
                  <button onClick={() => setAdminModalMember(null)} class="text-gray-400 font-bold hover:text-gray-600">✕</button>
                </div>

                {!isAdminAuthenticated ? (
                  <div class="space-y-4">
                    <p class="text-xs font-bold text-gray-600">프로필을 삭제하려면 관리자 비밀번호를 입력해주세요.</p>
                    <input
                      type="password"
                      placeholder="비밀번호 입력"
                      value={adminPassword}
                      onChange={(e) => setAdminPassword(e.target.value)}
                      class="w-full p-3 border-2 border-amber-200 rounded-xl focus:outline-none focus:border-amber-400 font-bold text-center tracking-widest text-lg"
                      autoFocus
                    />
                    <button
                      onClick={() => {
                        if (adminPassword === '0130') {
                          setIsAdminAuthenticated(true);
                        } else {
                          alert('비밀번호가 틀렸습니다!');
                          setAdminPassword('');
                        }
                      }}
                      class="w-full py-2.5 bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold rounded-xl shadow"
                    >
                      확인
                    </button>
                  </div>
                ) : (
                  <div class="space-y-4 text-center">
                    <p class="text-sm font-bold text-rose-600">비밀번호가 확인되었습니다.</p>
                    <button
                      onClick={() => handleDeleteMember(adminModalMember.id)}
                      class="w-full py-3 bg-rose-500 hover:bg-rose-600 text-white font-black rounded-xl shadow border-b-4 border-rose-700 transition"
                    >
                      ❌ 이 프로필 영구 삭제하기
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const interval = setInterval(() => {
      const rootEl = document.getElementById('root');
      if (rootEl) {
        clearInterval(interval);
        ReactDOM.render(<App />, rootEl);
      }
    }, 50);
  </script>
</body>
</html>
